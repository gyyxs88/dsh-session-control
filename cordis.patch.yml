# Safe by default: no session receives control tools until its durable session
# id is explicitly listed by the deployment patch that loads this bundle.
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: authorized-session-control
      name: 'dsh-session-control'
      config:
        controllerSessionIds: []
        stateDir: '.dsh-session-control'
        sameWorkspaceOnly: false
        maxPendingPerTarget: 3
        maxPendingPerSource: 10
        rateLimitPerMinute: 5
        maxOperations: 500
        approvalDelegationTimeoutMs: 900000
